name: CI TEST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      tidbcloudlake:
        image: datafuselabs/databend:nightly
        env:
          QUERY_DEFAULT_USER: tidbcloudlake
          QUERY_DEFAULT_PASSWORD: tidbcloudlake
          MINIO_ENABLED: true
        ports:
          - 8000:8000
          - 9000:9000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pip Install
        run: |
          pip install pipenv
          pipenv install --dev --skip-lock

      - name: Verify Service Running
        run: |
          cid=$(docker ps -aq --filter "ancestor=datafuselabs/databend:nightly" | head -n1)
          test -n "${cid}"
          docker logs "${cid}"
          curl -v http://localhost:8000/v1/health

      - name: SQLAlchemy Test Suite
        env:
          TEST_DATABEND_DSN: "lake://tidbcloudlake:tidbcloudlake@localhost:8000/default?sslmode=disable"
        run: |
          pipenv run pytest -s .
