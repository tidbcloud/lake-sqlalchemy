name: Dependency security regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  locked-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pipenv
      - run: pipenv verify && pipenv sync --dev
      - run: pipenv run pytest --confcutdir=tests/unit -o addopts='' tests/unit -q

  superset-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      - run: uv pip install -e . -r tests/superset_requirements.txt pytest
      - run: uv pip check
      - run: uv run --no-project python -m pytest --confcutdir=tests/security -o addopts='' tests/security -q
      - run: uv run --no-project python -m pytest --confcutdir=tests/unit -o addopts='' tests/unit -q
